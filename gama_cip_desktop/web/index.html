<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gama United · CIP Maker</title>
<style>
:root{
  --navy:#0c1630; --navy-2:#13204a; --navy-3:#1c2c5c; --cyan:#2fd3e6; --blue:#1463d6; --blue-ink:#0b4fb3;
  --bg:#f3f5f9; --card:#ffffff; --line:#e1e6ef; --line-2:#cfd6e3; --ink:#111a2e; --ink-2:#4a5672; --ink-3:#7b86a0;
  --ok:#14874f; --ok-bg:#e5f5ec; --warn:#a15c00; --warn-bg:#fff3df; --bad:#b4232c; --bad-bg:#fde8ea; --info-bg:#e8f0fd;
  --r:10px; --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* sidebar */
.side{background:var(--navy);color:#dfe6f7;display:flex;flex-direction:column;padding:22px 14px 16px;position:relative;overflow:hidden}
.side:before{content:"";position:absolute;right:-90px;bottom:-40px;width:260px;height:360px;background:linear-gradient(160deg,rgba(47,211,230,.10),rgba(20,99,214,.18));transform:skewX(-18deg)}
.brand{padding:0 8px 26px;position:relative}
.brand .wm{font-size:22px;letter-spacing:.02em;color:#fff;display:flex;align-items:center;gap:0}
.brand .wm b{font-weight:800}.brand .wm span{font-weight:300;padding-left:7px;margin-left:7px;border-left:3px solid var(--cyan)}
.brand .sub{margin-top:8px;font-size:11px;letter-spacing:.42em;color:var(--cyan);font-weight:700}
.nav{display:flex;flex-direction:column;gap:4px;position:relative}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;box-sizing:border-box;padding:10px 12px;border-radius:8px;color:#c5cfe8;font-weight:500}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button.on{background:var(--navy-3);color:#fff;box-shadow:inset 3px 0 0 var(--cyan)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;position:relative;font-size:12px;color:#9eabcb;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.side .foot a{color:#c5cfe8;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
/* main */
main{overflow:auto;padding:26px 30px 40px}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.lead{color:var(--ink-2);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
#detail,#pform{min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:550}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus,input[type=search]:focus{outline:2px solid rgba(20,99,214,.25);border-color:var(--blue)}
textarea{resize:vertical;min-height:70px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{background:var(--blue-ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2)}.btn.ghost:hover{background:#f6f8fc}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f0c3c7}.btn.danger:hover{background:var(--bad-bg)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:999px;background:#eef1f6;color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--blue-ink)}
.note{border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-bg);color:#6b3e00}.note.bad{background:var(--bad-bg);color:#7d1219}.note.info{background:var(--info-bg);color:#123c7c}
.muted{color:var(--ink-3)}.small{font-size:12.5px}.mono{font-family:var(--mono);font-size:12.5px}
/* drop */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;background:#fafbfd;cursor:pointer;transition:.15s}
.drop.over{border-color:var(--blue);background:var(--info-bg)}
.drop b{color:var(--blue)}
/* history */
.arch{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.archhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.arch input[type=search]{width:100%;box-sizing:border-box;margin-bottom:8px}
.archf{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.archf select{font-size:12.5px;padding:6px 8px}
.dayh{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:capitalize;padding:10px 4px 2px;letter-spacing:.02em}
.hist{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 470px);min-height:240px;overflow:auto;margin:0 -4px;padding:0 4px}
.hist button.more{text-align:center;font-weight:650;color:var(--blue);background:#f6f8fc}
.hist button{all:unset;cursor:pointer;display:block;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.hist button:hover{border-color:var(--line-2)}
.hist button.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(20,99,214,.12)}
.hist .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .m{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:12px;color:var(--ink-3)}
/* job */
.jobhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
.jobhead h2{margin:0;font-size:18px;word-break:break-all}
.spin{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.preview{position:relative;background:repeating-conic-gradient(#eef1f6 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.preview img{display:block;width:100%;height:auto}
.preview svg{position:absolute;inset:0;width:100%;height:100%}
.seps{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sep{display:grid;grid-template-columns:24px 150px 1fr 92px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.sep.off{opacity:.55}
.sep input{width:18px;height:18px;accent-color:var(--blue)}
.sep .nm{font-weight:650;display:flex;align-items:center;gap:7px;word-break:break-word}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);flex:none}
.sep .st{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2)}
.sep .st b{font-size:15px;color:var(--ink)}
.sep img{width:120px;border:1px solid var(--line);border-radius:4px;background:#fff;display:block}
.bars{width:100%;height:56px;display:block}
.export{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:end;margin-top:10px}
/* profiles */
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.plist button.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(20,99,214,.12)}
.plist .t{font-weight:600}.plist .m{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:9px;padding:14px;margin:0 0 14px}
legend{font-weight:700;font-size:13px;padding:0 6px;color:var(--ink)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink)}
.check input{width:17px;height:17px;accent-color:var(--blue)}
.hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.toast{word-break:break-word;position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;max-width:440px;box-shadow:0 10px 30px rgba(12,22,48,.25);display:none;z-index:9}
.toast.bad{background:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.ruler{display:grid;font-size:10px;font-weight:650;color:var(--blue-ink);text-align:center;margin-bottom:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ruler span{overflow:hidden}
.badge{margin-left:auto;background:var(--cyan);color:var(--navy);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;display:none}
.toast .act{all:unset;cursor:pointer;margin-left:12px;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.viewer{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.viewer.full{position:fixed;inset:14px;z-index:20;box-shadow:0 20px 60px rgba(12,22,48,.35);display:flex;flex-direction:column}
.vbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line);background:#f8fafd}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--navy);color:#fff}
.vchips{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;order:5}
.vbar .grow{flex:1}
.vchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:650;background:#fff;user-select:none}
.vchip.off{opacity:.4;text-decoration:line-through}
.vchip small{font-weight:500;color:var(--ink-3)}
.vstage{position:relative;overflow:auto;max-height:66vh;user-select:none;background:repeating-conic-gradient(#eef1f6 0 25%,#fff 0 50%) 0 0/16px 16px}
.viewer.full .vstage{max-height:none;flex:1}
.vinner{position:relative;margin:0 auto}
.vinner canvas,.vinner img{display:block;width:100%;height:auto;image-rendering:auto}
.vinner svg.grid{position:absolute;left:0;right:0;bottom:0;width:100%;pointer-events:none}
.vstage.pan{cursor:grab}.vstage.dragging{cursor:grabbing}
.vlens{position:fixed;z-index:31;pointer-events:none;display:none;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--navy),0 12px 30px rgba(0,0,0,.35)}
.vtip{position:fixed;z-index:30;pointer-events:none;background:rgba(12,22,48,.94);color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;display:none;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.vtip b{font-size:12.5px}.vtip .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.vtip .sw{width:10px;height:10px}
.vfoot{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);padding:8px 10px;border-top:1px solid var(--line)}
/* manual */
.doc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start;max-width:1180px}
.toc{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.toc a{color:var(--ink-2);text-decoration:none;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.toc a:hover{background:#f3f6fb;color:var(--ink)}
.toc a.on{background:var(--info-bg);color:var(--blue-ink);font-weight:650}
.dsec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;scroll-margin-top:8px}
.dsec h2{font-size:17px;margin:0 0 10px}
.dsec h3{font-size:14px;margin:16px 0 6px}
.dsec p,.dsec li{color:var(--ink-2);line-height:1.6}
.dsec p{margin:0 0 10px}
.dsec ul,.dsec ol{margin:0 0 10px;padding-left:20px}
.dsec b{color:var(--ink)}
.dsec .note{margin:10px 0}
.tree{font:12.5px/1.6 var(--mono);background:#f6f8fc;border:1px solid var(--line);border-radius:8px;padding:10px 14px;white-space:pre;overflow:auto;color:var(--ink)}
.kbd{display:inline-block;font:600 11.5px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:#fff;color:var(--ink)}
.dtab{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}
.dtab td,.dtab th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;color:var(--ink-2)}
.dtab th{color:var(--ink);font-weight:650;background:#f6f8fc}
@media (max-width:1000px){.doc{grid-template-columns:1fr}.toc{position:static}}
.fcard{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.fcard .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);grid-column:1/-1;align-items:center}
.fcard .stats b{color:var(--ink)}
.evrow{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.evrow.click{cursor:pointer}.evrow.click:hover{border-color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(12,22,48,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.upd{display:inline-flex;align-items:center;gap:6px;background:var(--cyan);color:var(--navy);font-weight:700;border-radius:999px;padding:2px 9px;font-size:11.5px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--blue)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="wm"><b>GAMA</b><span>UNITED</span></div><div class="sub">CIP MAKER</div></div>
    <nav class="nav">
      <button data-view="jobs" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/></svg>Obrada</button>
      <button data-view="hot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/><path d="M12 12v5M9.5 14.5 12 17l2.5-2.5"/></svg>Hot folderi<span class="badge" id="hotbadge"></span></button>
      <button data-view="profiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Profili mašina</button>
      <button data-view="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h7"/></svg>Uputstvo</button>
    </nav>
    <div class="foot">
      <div id="gs"><span class="dot" style="background:#7b86a0"></span>Proveravam Ghostscript…</div>
      <div><a id="datafolder">Folder sa podacima</a></div>
      <a id="ver" class="muted" style="text-decoration:none;cursor:pointer"></a>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = v => (v*100).toFixed(1).replace(".", ",") + " %";
const FINISHING = /(STANC|ŠTANC|BIG|PERFORACIJA)/i;
const VALIDATION = {reference_compared:["Upoređen sa uzorcima","info"], unverified:["Neproveren","warn"], press_verified:["Proveren na mašini","ok"]};
const STATUS = {queued:["U redu","info"], processing:["Obrada","info"], completed:["Završeno","ok"], failed:["Greška","bad"]};

async function api(method, path, body, raw){
  const opts = {method, headers:{"X-Token":TOKEN}};
  if (raw) opts.body = raw; else if (body !== undefined){ opts.body = JSON.stringify(body); opts.headers["Content-Type"]="application/json"; }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("Greška " + r.status));
  return data;
}
function toast(msg, bad, action, onAction){
  const t=$("#toast"); t.textContent=msg; t.className="toast"+(bad?" bad":"");
  if (action){ const b=document.createElement("button"); b.className="act"; b.textContent=action; b.onclick=()=>{ t.style.display="none"; onAction(); }; t.appendChild(b); }
  t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", action?9000:(bad?7000:3500));
}
const fileUrl = (job, name) => `/api/jobs/${job}/files/${encodeURIComponent(name)}?t=${encodeURIComponent(TOKEN)}`;
const rgbCss = rgb => `rgb(${rgb.map(v=>Math.round(v*255)).join(",")})`;

const S = {view:"jobs", profiles:[], jobs:[], job:null, page:0, sel:{}, profile:null, poll:null, exportForm:{}, hot:null, hotPoll:null,
           seq:0, unseen:0, vw:{mode:"sep", hidden:new Set(), scale:1, full:false, lens:false, lensZoom:2}, planes:{}};
window.__cipState = S;

/* ---------------- startup ---------------- */
async function init(){
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.view));
  $("#datafolder").onclick = () => window.pywebview ? window.pywebview.api.open_data_folder() : toast("Folder: " + S.dataDir);
  try{
    const st = await api("GET","/api/state");
    S.dataDir = st.data_dir;
    S.version = st.version;
    $("#gs").innerHTML = st.ghostscript.ok
      ? `<span class="dot" style="background:#2bd47f"></span>Ghostscript ${esc(st.ghostscript.version)}`
      : `<span class="dot" style="background:#ff5a64"></span>Ghostscript nije pronađen`;
    if (!st.ghostscript.ok) toast(st.ghostscript.error, true);
  }catch(e){ toast(e.message, true); }
  await loadProfiles(); await loadJobs(); await loadHot();
  S.seq = (S.hot && S.hot.seq) || 0;
  setInterval(pollActivity, 3000);
  await loadUpdate(true); setInterval(()=>loadUpdate(false), 15000);
  $("#ver").onclick = openUpdate;
  if (S.hot && !S.hot.root) return go("hot");   // first start: ask where the hot folders go
  render();
}
/* ---------------- updates ---------------- */
const UPD = {idle:"", checking:"Proveravam…", uptodate:"Najnovija verzija", available:"Nova verzija pronađena", downloading:"Preuzimam…",
             ready:"Spremno za instalaciju", installing:"Instaliram…", error:"Provera nije uspela"};
async function loadUpdate(first){
  try{ S.upd = await api("GET","/api/update"); }catch(e){ return; }
  const u = S.upd, has = ["ready","downloading","available"].includes(u.status) && u.latest;
  $("#ver").innerHTML = `Verzija ${esc(u.current)}` + (has ? ` <span class="upd">↑ ${esc(u.latest)}</span>` : "");
  if (first && u.updated_from) toast(`Program je ažuriran: ${u.updated_from} → ${u.current}.`);
  if ($("#updmodal")) renderUpdate();
}
function openUpdate(){ const m=document.createElement("div"); m.className="modal"; m.id="updmodal"; m.onclick=e=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m); renderUpdate(); }
function renderUpdate(){
  const m = $("#updmodal"), u = S.upd || {}; if (!m) return;
  const when = u.checked_at ? new Date(u.checked_at*1000).toLocaleString("sr-Latn-RS",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) : "još nije";
  m.innerHTML = `<div class="card">
    <div class="jobhead" style="margin-bottom:8px"><div><h2>Ažuriranje programa</h2>
      <div class="small muted" style="margin-top:4px">Instalirana verzija <b>${esc(u.current)}</b>${u.latest?` · najnovija <b>${esc(u.latest)}</b>`:""} · provereno: ${when}</div></div>
      <button class="btn ghost" id="updclose">Zatvori</button></div>

function badge(){ const b=$("#hotbadge"); b.textContent=S.unseen; b.style.display=S.unseen?"inline-block":"none"; }

async function pollActivity(){
  let a; try{ a = await api("GET","/api/activity?since="+S.seq); }catch(e){ return; }
  if (!a.events.length) return;
  S.seq = a.seq;
  const done = a.events.filter(e=>e.status!=="u obradi");
  const last = done[done.length-1];
  if (last){
    const ok = last.status==="OK";
    toast(`${last.printshop}: ${last.file} — ${ok ? "gotovo (" + (last.outputs||[]).filter(o=>!/\.PNG$/.test(o)).join(", ") + ")" : "GREŠKA"}`, !ok, last.job_id ? "Otvori" : null, ()=>openHotJob(last.job_id));
    if (S.view!=="hot"){ S.unseen += done.length; badge(); }
  }
  if (S.view==="jobs") await refreshList(); else await loadJobs();
  if (S.view==="hot"){ await loadHot(); renderHot(); }
}
async function loadHot(){ try{ S.hot = await api("GET","/api/hot"); }catch(e){ S.hot = null; } }
async function loadProfiles(){ S.profiles = (await api("GET","/api/profiles")).profiles; }
function loadFilters(){ try{ return Object.assign({q:"", printshop:"", status:"", source:"", days:0}, JSON.parse(localStorage.getItem("cip.filters")||"{}"), {q:""}); }catch(e){ return {q:"", printshop:"", status:"", source:"", days:0}; } }

async function loadJobs(){
  const f = S.f, qs = new URLSearchParams({q:f.q, printshop:f.printshop, status:f.status, source:f.source, days:f.days, limit:S.limit});
  const r = await api("GET","/api/jobs?"+qs); S.jobs = r.jobs; S.list = r;

}

function render(){

  try{
    const {job} = await api("POST", `/api/jobs?profile=${encodeURIComponent(prof)}&name=${encodeURIComponent(f.name)}`, undefined, f);

async function loadPlanes(j, page){
  const key = j.id + ":" + page.page;
  if (S.planes[key]) return S.planes[key];
  const planes = await Promise.all(page.channels.map(c => new Promise((ok, bad) => {
    const im = new Image(); im.onload = () => {
      const cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight;
      const cx = cv.getContext("2d", {willReadFrequently:true}); cx.drawImage(im, 0, 0);
      const d = cx.getImageData(0, 0, cv.width, cv.height).data, g = new Uint8Array(cv.width*cv.height);
      for (let i=0, k=0; i<g.length; i++, k+=4) g[i] = d[k];
      ok({name:c.name, rgb:c.name==="Yellow"?[0.95,0.84,0]:c.rgb, w:cv.width, h:cv.height, g});
    }; im.onerror = bad; im.src = fileUrl(j.id, c.view);

}
function composite(canvas, planes, hidden){

  const cx = canvas.getContext("2d"), out = cx.createImageData(w, h), d = out.data, n = w*h;
  d.fill(255);

    if (hidden.has(pl.name)) continue;

    const lut = [0,1,2].map(ch => { const t = new Uint16Array(256); for (let g=0; g<256; g++){ const a = 1 - g/255; t[g] = Math.round(256*(1 - a*(1 - pl.rgb[ch]))); } return t; });
    const [lr, lg, lb] = lut, g = pl.g;
    for (let i=0, k=0; i<n; i++, k+=4){ const v = g[i]; if (v !== 255){ d[k] = (d[k]*lr[v])>>8; d[k+1] = (d[k+1]*lg[v])>>8; d[k+2] = (d[k+2]*lb[v])>>8; } }

}
function viewMedia(){ return $("#vcanvas") || $("#vcomp"); }
function sourceSize(){ const m = viewMedia(); if (!m) return [1,1]; return m.tagName==="CANVAS" ? [m.width||1, m.height||1] : [m.naturalWidth||1, m.naturalHeight||1]; }
function fitWidth(){
  const stage = $("#vstage"); if (!stage) return 800;

  return Math.max(200, Math.floor(Math.min(stage.clientWidth - 2, availH * w / h)));
}
function maxScale(){ const [w] = sourceSize(); return Math.max(1, (w * 2) / fitWidth()); }   // up to 2 screen px per source px

  const old = inner.getBoundingClientRect(), sr = stage.getBoundingClientRect();

  const fx = (px + stage.scrollLeft) / Math.max(old.width, 1), fy = (py + stage.scrollTop) / Math.max(old.height, 1);
  S.vw.scale = scale;
  inner.style.width = Math.round(fitWidth() * scale) + "px";

  stage.scrollLeft = fx * nr.width - px; stage.scrollTop = fy * nr.height - py;

function sizeViewer(){ applyZoom(S.vw.scale || 1); }
async function bindViewer(j, page, p){

    b.onclick = () => { clearTimeout(clickTimer); clickTimer = setTimeout(()=>{ const n=b.dataset.vch; v.hidden.has(n)?v.hidden.delete(n):v.hidden.add(n); b.classList.toggle("off"); redraw(); }, 220); };

function renderProfiles(){
  if (!S.profile && S.profiles.length) S.profile = structuredClone(S.profiles[0]);
  $("#main").innerHTML = `<h1>Profili mašina</h1><p class="lead">Geometrija ploče i zona boje za svaku mašinu. Svaka izmena briše oznaku provere — profil se ponovo mora uporediti sa mašinom.</p>
  <div class="grid2"><div><div class="plist" id="plist">${S.profiles.map(p=>{const [vl,vc]=VALIDATION[p.validation_status]||["",""];
    return `<button data-id="${esc(p.id)}" class="${S.profile&&S.profile._orig===p.id||S.profile&&!S.profile._new&&S.profile.id===p.id?"on":""}"><div class="t">${esc(p.name)}</div><div class="m"><span class="chip ${p.usable?"ok":"bad"}">${p.usable?"Spreman":"Nepotpun"}</span><span class="chip ${vc}">${vl}</span></div></button>`;}).join("")}</div>
    <button class="btn ghost" id="pnew" style="margin-top:10px;width:100%;justify-content:center;box-sizing:border-box">+ Novi profil</button></div>
  <div id="pform">${S.profile?formHtml():`<div class="card empty">Nema profila.</div>`}</div></div>`;
  $("#plist").onclick = e => { const b=e.target.closest("button[data-id]"); if(!b) return; S.profile = structuredClone(S.profiles.find(p=>p.id===b.dataset.id)); renderProfiles(); };
  $("#pnew").onclick = () => { const base = S.profiles.find(p=>p.usable) || {}; S.profile = {...structuredClone(base), id:"", name:"", printshop:"", machine:"", notes:"", active:false, export_enabled:false, validation_status:"unverified", _new:true}; renderProfiles(); };
  if (S.profile) bindForm();
}
function fieldHtml(f){
  if (f.show && !f.show(S.profile)) return "";
  const v = S.profile[f.k], hint = f.hint ? `<span class="hint">${f.hint}</span>` : "", wide = f.wide ? 'style="grid-column:1/-1"' : "";
  if (f.type==="chk") return `<label class="f" style="color:var(--ink)"><span class="check"><input type="checkbox" data-k="${f.k}" ${(v ?? f.def) ? "checked" : ""}><b>${f.label}</b></span>${hint}</label>`;
  if (f.type==="sel") return `<label class="f" ${wide}>${f.label}<select data-k="${f.k}" ${f.num?'data-num="1"':""}>${f.opts.map(([o,l])=>`<option value="${o}" ${String(v??"")===String(o)?"selected":""}>${l}</option>`).join("")}</select>${hint}</label>`;
  if (f.type==="num") return `<label class="f">${f.label}<input type="number" step="${f.step}" data-k="${f.k}" data-num="1" value="${v??""}">${hint}</label>`;
  return `<label class="f" ${wide}>${f.label}<input type="text" data-k="${f.k}" value="${esc(v??"")}">${hint}</label>`;
}
function sectionHtml([title, fs]){
  const inner = fs.map(fieldHtml).join("");
  if (!inner) return "";
  return `<fieldset><legend>${title}</legend><div class="fg">${inner}</div>${title==="Ploča i zone boje"?`<div id="pdraw" style="margin-top:14px"></div>`:""}</fieldset>`;
}
function formHtml(){
  const p = S.profile, [vl,vc]=VALIDATION[p.validation_status]||["",""];
  return `<div class="card"><div class="jobhead"><div><h2>${esc(p.name||"Novi profil")}</h2><div class="small muted" style="margin-top:4px">${p._new?"Nov profil":`<span class="mono">${esc(p.id)}</span>`} <span class="chip ${vc}">${vl}</span></div></div>
    <div class="row">${p._new?"":`<button class="btn ghost" id="pdup">Dupliraj</button><button class="btn danger" id="pdel">Obriši</button>`}<button class="btn" id="psave">Sačuvaj</button></div></div>

    <details id="padv" ${S.advOpen?"open":""} style="margin:0 0 14px"><summary style="cursor:pointer;font-weight:700;padding:6px 2px">Napredno <span class="muted small" style="font-weight:400">— tehnička podešavanja, ne menjati bez potrebe</span></summary>
      <div style="margin-top:10px">${FIELDS.filter(x=>x[2]==="adv").map(sectionHtml).join("")}</div></details>
    <fieldset><legend>Napomene</legend><textarea data-k="notes" rows="4" style="width:100%">${esc(p.notes??"")}</textarea></fieldset></div>`;

function liveCheck(){
  const p = S.profile, out = [];
  const req = {machine:"Mašina",plate_width_mm:"Širina ploče",plate_height_mm:"Visina ploče",zone_count:"Broj zona",zone_width_mm:"Širina zone",area_height_mm:"Visina zone boje",shift_x_mm:"Pomak X",top_mm:"Gornji ofset"};
  if (p.xml_enabled !== false) Object.assign(req, {signature:"Signature", sheet:"Sheet"});
  if (p.xml_enabled === false && !p.ppf_enabled) out.push("izlaz (XML ili PPF)");
  for (const [k,l] of Object.entries(req)) if (p[k]===null||p[k]===undefined||p[k]==="") out.push(l);
  const warn = [];
  if (p.zone_count && p.zone_width_mm && p.plate_width_mm && p.zone_count*p.zone_width_mm > p.plate_width_mm) warn.push(`Zbir zona (${p.zone_count} × ${p.zone_width_mm} = ${+(p.zone_count*p.zone_width_mm).toFixed(2)} mm) je veći od širine ploče.`);
  if (p.area_height_mm && p.plate_height_mm && p.area_height_mm > p.plate_height_mm) warn.push("Visina zone boje je veća od visine ploče.");
  $("#pcheck").innerHTML = (out.length?`<div class="note warn" style="margin-bottom:14px"><b>Profil se još ne može koristiti za obradu.</b> Nedostaje: ${out.join(", ")}.</div>`:"")
    + warn.map(w=>`<div class="note info" style="margin-bottom:14px">${esc(w)}</div>`).join("");
  draw();
}
function draw(){
  const p=S.profile, el=$("#pdraw"); if(!el) return;
  if(!(p.plate_width_mm>0&&p.plate_height_mm>0&&p.zone_count>0&&p.zone_width_mm>0&&p.area_height_mm>0)){ el.innerHTML=""; return; }
  const zw=p.zone_count*p.zone_width_mm, W=Math.max(zw,p.plate_width_mm), H=Math.max(p.area_height_mm,p.plate_height_mm)+20, s=520/W;
  const px=(zw-p.plate_width_mm)/2+(p.shift_x_mm||0), py=(p.top_mm||0);
  const zones=Array.from({length:p.zone_count},(_,i)=>`<rect x="${i*p.zone_width_mm*s}" y="0" width="${p.zone_width_mm*s}" height="${p.area_height_mm*s}" fill="${i%2?"#e8f0fd":"#f3f7fe"}" stroke="#9fb7e6" stroke-width=".6"/>`).join("");
  el.innerHTML = `<div class="small muted" style="margin-bottom:6px">Šema (plavo = zone boje, isprekidano = PDF ploča; ako je PDF tabak, stvarni položaj zavisi od formata)</div>
    <svg viewBox="-4 -4 ${W*s+8} ${H*s+8}" style="width:100%;max-width:560px;height:auto;display:block">${zones}
    <rect x="${px*s}" y="${py*s}" width="${p.plate_width_mm*s}" height="${p.plate_height_mm*s}" fill="none" stroke="#111a2e" stroke-width="1.2" stroke-dasharray="5 3"/></svg>`;
}
function bindForm(){
  const form=$("#pform");
  form.querySelectorAll("[data-k]").forEach(inp=>{
    inp.addEventListener(inp.type==="checkbox"||inp.tagName==="SELECT"?"change":"input",()=>{
      const k=inp.dataset.k; let v = inp.type==="checkbox"?inp.checked:inp.value;
      if (inp.dataset.num) v = v===""?null:Number(v);
      if (k==="side" && v==="") v=null;
      S.profile[k]=v;
      if (k==="name") form.querySelector("h2").textContent = v || "Novi profil";
      if (k==="xml_enabled" || k==="ppf_enabled"){   // show only the fields of the chosen output
        const y = $("main").scrollTop; S.advOpen = $("#padv").open; $("#pform").innerHTML = formHtml(); bindForm(); $("main").scrollTop = y; return;
      }
      liveCheck();
    });
  });
  liveCheck();
  $("#padv").ontoggle = e => S.advOpen = e.target.open;
  $("#psave").onclick = async()=>{
    const p = {...S.profile}; const orig = p._new ? null : (p._orig || p.id); delete p._new; delete p._orig;
    if (!orig) delete p.id;
    try{ const {profile} = await api("POST","/api/profiles",{profile:p, original_id:orig}); await loadProfiles(); S.profile=structuredClone(profile);
      toast(profile.usable?"Profil je sačuvan.":"Profil je sačuvan, ali još nije spreman za obradu."); renderProfiles(); }catch(e){ toast(e.message,true); }
  };
  $("#pdup") && ($("#pdup").onclick=()=>{ S.profile={...structuredClone(S.profile), id:"", name:S.profile.name+" (kopija)", validation_status:"unverified", _new:true}; renderProfiles(); });
  $("#pdel") && ($("#pdel").onclick=async()=>{ if(!confirm(`Obrisati profil „${S.profile.name}“? Raniji poslovi ostaju sačuvani.`)) return;
    try{ await api("DELETE","/api/profiles/"+encodeURIComponent(S.profile.id)); await loadProfiles(); S.profile=null; renderProfiles(); toast("Profil je obrisan."); }catch(e){toast(e.message,true);} });
}

function renderHelp(){
  $("#main").innerHTML = `<h1>Uputstvo za rad</h1><p class="lead">Gama United CIP Maker · verzija ${esc(S.version||"")}</p>
    <div class="doc"><nav class="toc" id="toc">${HELP.map(([id,t],i)=>`<a data-sec="${id}" class="${i?"":"on"}">${t}</a>`).join("")}</nav>
    <div id="docbody">${HELP.map(([id,t,body])=>`<section class="dsec" id="h-${id}"><h2>${t}</h2>${body}</section>`).join("")}</div></div>`;
  const main = $("main"), links = [...document.querySelectorAll("#toc a")];
  links.forEach(a => a.onclick = () => $("#h-"+a.dataset.sec).scrollIntoView({behavior:"smooth", block:"start"}));
  main.scrollTop = 0;
  main.onscroll = () => { if (S.view!=="help") { main.onscroll = null; return; }
    const top = main.getBoundingClientRect().top + 40; let cur = HELP[0][0];
    for (const [id] of HELP){ const el = $("#h-"+id); if (el && el.getBoundingClientRect().top <= top) cur = id; }
    links.forEach(a => a.classList.toggle("on", a.dataset.sec===cur)); };
}
init();
</script>
