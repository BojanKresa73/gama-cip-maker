name: Windows instaler

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # No PYTHONUTF8 on purpose: tests must run with the same Windows code page as the installed program.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      HAS_INSTALER_TOKEN: ${{ secrets.INSTALER_TOKEN != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python biblioteke
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PyInstaller with a bootloader compiled here instead of the shared prebuilt one,
          # which antivirus programs often flag (false positives).
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --no-binary pyinstaller "pyinstaller>=6.10"

      - name: Ghostscript (ugrađuje se u program)
        run: |
          choco install ghostscript -y --no-progress
          $gs = Get-ChildItem "C:\Program Files\gs" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $gs) { throw "Ghostscript nije instaliran" }
          New-Item -ItemType Directory -Force ghostscript\bin | Out-Null
          Copy-Item "$($gs.FullName)\bin\*" ghostscript\bin\ -Recurse
          & ghostscript\bin\gswin64c.exe --version

      - name: Testovi
        run: |
          $env:GAMA_GS = (Resolve-Path ghostscript\bin\gswin64c.exe).Path
          $env:PYTHONPATH = "$pwd;$pwd\tests"
          # Temp folder with Serbian letters, like a Windows user named Đorđe.
          $t = "C:\Temp Đorđe Šćž"; New-Item -ItemType Directory -Force $t | Out-Null
          $env:TEMP = $t; $env:TMP = $t
          python tools\ci_tests.py

      - name: Pravljenje programa (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --windowed --name GamaCIPMaker `
            --icon packaging\icon.ico `
            --version-file packaging\version_info.txt `
            --add-data "gama_cip_desktop\web;gama_cip_desktop\web" `
            --add-data "gama_cip_desktop\seed_profiles;gama_cip_desktop\seed_profiles" `
            --add-data "ghostscript;ghostscript" `
            --collect-submodules webview `
            --collect-data pymupdf `
            --hidden-import pystray._win32 `
            run_gama_cip.py

      - name: Samoprovera gotovog .exe programa
        run: |
          $report = "$pwd\selftest.txt"
          Get-ChildItem dist\GamaCIPMaker\_internal\ghostscript\bin | Select-Object -First 5 | ForEach-Object { Write-Host $_.Name }
          $p = Start-Process dist\GamaCIPMaker\GamaCIPMaker.exe -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $report) {
            $text = Get-Content $report -Raw -Encoding utf8
            Write-Host $text
            $msg = $text.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            if ($p.ExitCode -ne 0) { Write-Host "::error title=Samoprovera::$msg" } else { Write-Host "::notice title=Samoprovera::$msg" }
          } else {
            Write-Host "::error title=Samoprovera::Izveštaj nije napravljen (exit code $($p.ExitCode))"
          }
          if ($p.ExitCode -ne 0) { throw "Samoprovera nije prošla" }

      - name: Provera pravog prozora programa
        run: |
          $report = "$pwd\guitest.txt"
          $p = Start-Process dist\GamaCIPMaker\GamaCIPMaker.exe -ArgumentList "--guitest", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; Write-Host "::error title=Prozor::Program se zaglavio (nije završio za 150 s)" }
          $log = "$env:LOCALAPPDATA\GamaCIP\gama-cip.log"
          $text = if (Test-Path $report) { Get-Content $report -Raw -Encoding utf8 } else { "Izveštaj nije napravljen" }
          if (Test-Path $log) { $text += "`n--- gama-cip.log ---`n" + ((Get-Content $log -Encoding utf8 | Select-Object -Last 40) -join "`n") }
          Write-Host $text
          $msg = $text.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
          if ($text -match "GUITEST OK") { Write-Host "::notice title=Prozor::$msg" } else { Write-Host "::error title=Prozor::$msg"; throw "Prozor nije prošao proveru" }

      - name: Provera hot foldera (srpska slova u putanjama i imenima)
        run: |
          $base = "C:\CIP proba Đorđe Šćž"
          New-Item -ItemType Directory -Force "$base\temp" | Out-Null
          $env:TEMP = "$base\temp"; $env:TMP = "$base\temp"; $env:GAMA_CIP_DATA = "$base\podaci"
          $report = "$pwd\hottest.txt"
          $p = Start-Process dist\GamaCIPMaker\GamaCIPMaker.exe -ArgumentList "--hottest", "`"$base\Hot folderi ŠĐČĆŽ Ђурђевак`"", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(400000)) { Stop-Process -Id $p.Id -Force }
          $text = if (Test-Path $report) { Get-Content $report -Raw -Encoding utf8 } else { "Izveštaj nije napravljen" }
          $log = "$base\podaci\gama-cip.log"
          if (Test-Path $log) { $text += "`n--- gama-cip.log ---`n" + ((Get-Content $log -Encoding utf8 | Select-Object -Last 25) -join "`n") }
          Write-Host $text
          $msg = $text.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
          if ($text -match "HOTTEST OK") { Write-Host "::notice title=Hot folder::$msg" } else { Write-Host "::error title=Hot folder::$msg"; throw "Hot folder nije prošao proveru" }

      - name: Instaler (Inno Setup)
        id: inst
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path gama_cip_desktop\__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          Get-ChildItem installer
          Get-FileHash installer\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File installer\SHA256SUMS.txt -Encoding ascii
          Get-Content installer\SHA256SUMS.txt
          # Release notes = this commit's message without the attribution lines.
          (git log -1 --pretty=%B) | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' } |
            Out-File installer\notes.md -Encoding utf8

      - name: Provera tihe instalacije i automatskog ažuriranja (srpska slova u putanjama)
        run: |
          $base = "C:\CIP ažuriranje Đorđe"
          $dir = "$base\program"
          New-Item -ItemType Directory -Force "$base\temp", "$base\izvor" | Out-Null
          $env:TEMP = "$base\temp"; $env:TMP = "$base\temp"; $env:GAMA_CIP_DATA = "$base\podaci"
          $setup = (Get-ChildItem installer\GamaCIPMaker-Setup-*.exe | Select-Object -First 1).FullName
          # 1) silent install, the same way the program installs updates
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/norelaunch=1", "/LOG=`"$base\install1.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\GamaCIPMaker.exe")) { Get-Content "$base\install1.log" -Tail 30; throw "Tiha instalacija nije uspela ($($p.ExitCode))" }
          $p = Start-Process "$dir\GamaCIPMaker.exe" -ArgumentList "--selftest", "`"$base\selftest.txt`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$base\selftest.txt"; throw "Instalirani program nije prošao samoproveru" }
          # 2) a fake newer release (99.0.0) made from this installer, served as local files
          Copy-Item $setup "$base\izvor\GamaCIPMaker-Setup-99.0.0.exe"
          $hash = (Get-FileHash "$base\izvor\GamaCIPMaker-Setup-99.0.0.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  GamaCIPMaker-Setup-99.0.0.exe" | Out-File "$base\izvor\SHA256SUMS.txt" -Encoding ascii
          $uri = { param($p) ([System.Uri]::new($p)).AbsoluteUri }
          $release = @{ tag_name = "v99.0.0"; body = "Probna verzija"; assets = @(
            @{ name = "GamaCIPMaker-Setup-99.0.0.exe"; size = (Get-Item "$base\izvor\GamaCIPMaker-Setup-99.0.0.exe").Length; browser_download_url = (& $uri "$base\izvor\GamaCIPMaker-Setup-99.0.0.exe") },
            @{ name = "SHA256SUMS.txt"; size = 100; browser_download_url = (& $uri "$base\izvor\SHA256SUMS.txt") }) }
          $release | ConvertTo-Json -Depth 5 | Out-File "$base\izvor\release.json" -Encoding utf8
          $env:GAMA_CIP_UPDATE_URL = (& $uri "$base\izvor\release.json")
          # 3) the INSTALLED program updates itself: check, download, SHA-256, silent install, restart
          # -Wait would also wait for the installer and the restarted program (descendants): wait for this process only.
          $p = Start-Process "$dir\GamaCIPMaker.exe" -ArgumentList "--updatetest", "`"$base\update.txt`"" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force }
          $report = if (Test-Path "$base\update.txt") { Get-Content "$base\update.txt" -Raw -Encoding utf8 } else { "nema izveštaja" }
          Write-Host $report
          if ($report -notmatch "UPDATETEST STARTED") { throw "Ažuriranje nije pokrenuto" }
          $installLog = "$base\podaci\updates\GamaCIPMaker-Setup-99.0.0.log"
          $appLog = "$base\podaci\gama-cip.log"
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            $installed = (Test-Path $installLog) -and ((Get-Content $installLog -Raw -Encoding utf8) -match "Installation process succeeded")
            $restarted = (Test-Path $appLog) -and ((Get-Content $appLog -Raw -Encoding utf8) -match "Pokrenut posle ažuriranja")
            $ok = $installed -and $restarted
          }
          $launcher = "$base\podaci\updates\launcher.log"
          $text = $report + "`n--- pokretač ---`n" + $(if (Test-Path $launcher) { (Get-Content $launcher -Encoding utf8) -join "`n" } else { "nema loga" }) +
                  "`n--- instalacija ---`n" + $(if (Test-Path $installLog) { (Get-Content $installLog -Tail 6) -join "`n" } else { "nema loga" }) +
                  "`n--- program ---`n" + $(if (Test-Path $appLog) { (Get-Content $appLog -Encoding utf8 -Tail 8) -join "`n" } else { "nema loga" })
          Get-Process GamaCIPMaker -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host $text
          $msg = $text.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
          if ($ok) { Write-Host "::notice title=Ažuriranje::$msg" } else { Write-Host "::error title=Ažuriranje::$msg"; throw "Automatsko ažuriranje nije prošlo proveru" }

      - uses: actions/upload-artifact@v4
        with:
          name: GamaCIPMaker-instaler
          path: installer/*.exe
          retention-days: 30

      - name: Objava verzije u Releases (verzija iz gama_cip_desktop/__init__.py)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.inst.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gama United CIP Maker ${{ steps.inst.outputs.version }}
          body: |
            Windows instaler. Preuzmite GamaCIPMaker-Setup-${{ steps.inst.outputs.version }}.exe i pokrenite ga (administratorska prava nisu potrebna).
            Program je prošao testove i samoproveru na Windows-u (obrada PDF-a, XML i PPF izvoz).
          files: |
            installer/*.exe
            installer/SHA256SUMS.txt

      - name: Objava za automatsko ažuriranje (javni repozitorijum gama-cip-maker-instaler)
        if: github.ref == 'refs/heads/main' && env.HAS_INSTALER_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: BojanKresa73/gama-cip-maker-instaler
          token: ${{ secrets.INSTALER_TOKEN }}
          tag_name: v${{ steps.inst.outputs.version }}
          name: Gama United CIP Maker ${{ steps.inst.outputs.version }}
          body_path: installer/notes.md
          make_latest: "true"
          files: |
            installer/*.exe
            installer/SHA256SUMS.txt

      - name: Napomena ako token za objavu nije podešen
        if: env.HAS_INSTALER_TOKEN != 'true'
        run: Write-Host "::warning title=Automatsko ažuriranje::Secret INSTALER_TOKEN nije podešen; instaler nije objavljen u gama-cip-maker-instaler."
